# VAELEN kernel CI - builds and tests the engine-agnostic simulation kernel
# headless (no Unreal Engine required). The Unreal project itself is NOT built
# by any automation yet: it needs an engine-backed runner (see
# Docs/ARCHITECTURE.md, "Build pipeline"). Until then the Unreal-facing files
# stay labelled UNVERIFIED.
name: kernel-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kernel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # The suite grows with every phase and the debug legs run every gate with
    # assertions on; 30 minutes was cutting it fine by Phase 08, and 120 was cut
    # in Phase 13 - not by the work added, but by WHEN the long poles were
    # scheduled. Gameplay.Shuffled was picked up 95 minutes into a 120-minute
    # budget and needed 45 of its own. Tests/*/CMakeLists.txt now give the long
    # poles a COST so ctest starts them first; this is the headroom that keeps a
    # packing accident from reading as a failure.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-debug, linux-clang-release, linux-clang-noasserts, linux-gcc-debug, linux-gcc-release, linux-gcc-noasserts]
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          clang++ --version
          g++ --version
          cmake --version
          ninja --version
          python3 --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format (18)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          clang-format-18 --version
          git ls-files 'Source/*.h' 'Source/*.cpp' 'Tests/*.h' 'Tests/*.cpp' | grep -v 'Source/Vaelen/' \
            | xargs clang-format-18 --style=file --dry-run -Werror

  parse:
    name: engine modules parse (clang 18)
    runs-on: ubuntu-24.04
    # Seconds, not minutes: it is a front end over nine translation units.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # WHAT THIS JOB IS AND IS NOT (ADR-0134).
      #
      # VaelenPresentation needs an engine and this runner has none, so nothing
      # here BUILDS it and nothing here may claim it is validated - it stays
      # UNVERIFIED until an editor has run it. What this does is PARSE it
      # against Tools/EngineShim, which catches the class of defect that twice
      # reached the project owner's machine first: a renamed member, an
      # argument count, a type that changed.
      #
      # The self-test runs FIRST and is the reason to believe the parse. It
      # breaks the modules on a temporary copy, one way at a time - the first
      # being the defect that actually shipped in 13.07c - and fails if the
      # parser did not notice, so a shim that has silently stopped working
      # cannot go on reporting green. Since 14.07 it also carries a REVERSE
      # control: the healthy copy parsed with --stub-scope own must FAIL,
      # which is what proves the shared stub directory is load-bearing.
      - name: Shim self-test
        run: python3 Tools/test_engine_shim.py
      - name: Parse
        run: python3 Tools/parse_engine_modules.py
      # Also runs as the CTest entry Kernel.WorldWiring on every build leg. Run
      # here too because this job is seconds long and the build legs are an
      # hour: a wiring that has drifted should be known before the hour starts.
      - name: World wiring
        run: python3 Tools/check_world_wiring.py
      # 14.07. Also CTest Kernel.UiFence on every build leg; here too because
      # this job is seconds long and the build legs are an hour.
      - name: UI fence
        run: |
          set -o pipefail
          python3 Tools/check_ui_fence.py --self-test
          python3 Tools/check_ui_fence.py
      # The stubs the parse writes must be the .generated.h includes the tree
      # actually has: two numbers from two different readers, equal or the job
      # is red. A stub silently not written is a header silently not checked.
      - name: Generated stubs
        run: |
          set -o pipefail
          # -E and a + rather than a *: the star form also matches a bare
          # ".generated.h" written in a sentence, and a comment about the
          # stubs would then be counted as one. The wiring guard learned the
          # same lesson the same way (check_world_wiring.py).
          WANTED=$(grep -hoE '[A-Za-z]+\.generated\.h' Source/Vaelen*/Public/*.h Source/Vaelen*/Private/*.cpp \
                   Tools/UiWitness/*/Public/*.h Tools/UiWitness/*/Private/*.cpp | sort -u | wc -l)
          MADE=$(python3 Tools/parse_engine_modules.py --verbose | grep -c '^\[parse\] generated stubs: '"$WANTED"' ')
          test "$MADE" = 1
      - name: Kernel modules
        # Thirteen kernel modules since 14.03 (VaelenRun). The count is what the
        # purity checker enumerates from Tools/kernel_modules.txt, so a module
        # missing from that list, or listed with no directory on disk, shows
        # here in seconds rather than on a build leg an hour later.
        # pipefail, or tail's 0 would stand in for the checker's 1: the step
        # prints the violation count as if it enforced it, so it does.
        run: |
          set -o pipefail
          python3 Tools/check_kernel_purity.py --root . --verbose | tee purity.log | tail -1
          test "$(grep -c '^\[purity\] module ' purity.log)" = 13

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    # An MSVC debug build runs the suite about four times slower than Linux
    # debug does, and it is the one leg that cannot be parallelised away.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc-debug
      - name: Test
        # Everything but the shuffled re-runs: those re-run every suite a second
        # time to catch order dependence between tests, which is a property of
        # the tests and not of the compiler. Every Linux leg runs them.
        run: ctest --preset windows-msvc-debug -E Shuffled

  macos:
    name: macOS (AppleClang)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          clang++ --version
          cmake --version
          ninja --version
      - name: Configure
        run: cmake --preset macos-debug
      - name: Build
        run: cmake --build --preset macos-debug
      - name: Test
        run: ctest --preset macos-debug
